[project]
name = "planar-symmetric-pattern-reproduction"
version = "0.1.0"
description = "Claim-by-claim CPU reproduction of arXiv:2606.02073"
requires-python = "==3.12.*"
dependencies = [
  "kornia==0.8.1",
  "matplotlib==3.10.3",
  "numpy==1.26.4",
  "pillow==11.3.0",
  "pyamg==5.3.0",
  "scipy==1.15.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.67.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
